name: validate

on:
  push:
  pull_request:

jobs:
  esphome-config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install esphome==2026.9.1
      - name: Create a dummy secrets.yaml
        run: |
          cat > tests/secrets.yaml <<'SECRETS'
          wifi_ssid: "ci"
          wifi_password: "ci-password"
          api_encryption_key: "dGhpc2lzYXRlc3RrZXl0aGlzaXNhdGVzdGtleTEyMzQ="
          ota_password: "ci"
          todoist_token: "ci"
          SECRETS
      - name: esphome config
        run: |
          esphome config tests/minimal.yaml
          esphome config tests/full.yaml
