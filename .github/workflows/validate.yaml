name: validate

on:
  push:
  pull_request:

jobs:
  esphome-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install esphome==2026.9.1
      - name: Create a dummy secrets.yaml
        run: |
          cat > tests/secrets.yaml <<'SECRETS'
          wifi_ssid: "ci"
          wifi_password: "ci-password"
          api_encryption_key: "dGhpc2lzYXRlc3RrZXl0aGlzaXNhdGVzdGtleTEyMzQ="
          ota_password: "ci"
          todoist_token: "ci"
          SECRETS
      - name: esphome config
        run: |
          esphome config tests/minimal.yaml
          esphome config tests/full.yaml
