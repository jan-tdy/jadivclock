# JadivClock core: identity, networking, time and diagnostics.
#
# Everything in here is hardware-independent. Override any substitution from
# your own config; the values below are only defaults.
substitutions:
  name: jadivclock
  friendly_name: JadivClock
  # IANA time zone name, e.g. Europe/Berlin, America/New_York.
  timezone: UTC
  # TLS certificate verification for Todoist / Open-Meteo requests. Keep true
  # (the API token is sent over these connections); only set false to debug.
  http_verify_ssl: "true"
  # Name shown in the greeting on the home screen ("Hello <user_name>").
  user_name: ""
  log_level: INFO

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

logger:
  level: ${log_level}
  hardware_uart: UART0

api:
  encryption:
    key: !secret api_encryption_key
  # Feature packages append their own `then:` steps here (e.g. resync widgets
  # after Home Assistant reconnects).
  on_client_connected:
    then:
      - logger.log: "Home Assistant connected"

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# http_request is synchronous: a request blocks the main loop until it
# completes. Scripts that call it show a loading dialog first and wait
# 100ms so LVGL can flush that frame before the call starts.
http_request:
  useragent: esphome/jadivclock
  timeout: 10s
  verify_ssl: ${http_verify_ssl}

json:

time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}

sensor:
  - platform: internal_temperature
    name: "ESP32 Temperature"
    id: esp_temp
    update_interval: 60s
  - platform: wifi_signal
    id: wifi_rssi
    name: "WiFi Signal"
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: "IP Address"
