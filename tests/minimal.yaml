# CI/regression copy of examples/minimal.yaml using local packages.
# Example: just the clock, with weather.
substitutions:
  name: my-clock
  friendly_name: My JadivClock
  timezone: Europe/Berlin
  weather_lat: "52.52"
  weather_lon: "13.405"

packages:
  core: !include ../packages/core.yaml
  hw: !include ../packages/hw/crowpanel_35.yaml
  ui: !include ../packages/ui/base.yaml
  weather: !include ../packages/features/weather.yaml
